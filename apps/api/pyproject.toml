[project]
name = "promptimizer-api"
version = "0.1.0"
description = "Promptimizer FastAPI gateway — quality-aware LLM routing, prompt cache, BYOK."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Promptimizer" }]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.10.0",
  "redis>=6.2.0",
  "orjson>=3.10.0",
  "python-dotenv>=1.1.0",
  "cryptography>=45.0.0",
  "qdrant-client>=1.13.0",
  "openai>=1.100.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends() in defaults is intentional
]
