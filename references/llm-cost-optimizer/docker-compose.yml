services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
    depends_on:
      - redis
      - qdrant
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
