[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-optimizer"
version = "0.1.0"
description = "BYOK OpenAI-compatible LLM model discovery and quality-aware routing foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "openai>=1.75",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-openai>=0.3",
    "langsmith>=0.3",
]
rag = [
    "qdrant-client>=1.13",
    "ragas>=0.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
